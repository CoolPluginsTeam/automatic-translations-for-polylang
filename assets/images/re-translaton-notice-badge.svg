<svg width="260" height="210" viewBox="0 0 260 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#6D5BD0" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7762F6"/>
      <stop offset="100%" stop-color="#5636D8"/>
    </linearGradient>
  </defs>

  <!-- top card -->
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="170" height="64" rx="11" fill="#FFFFFF"/>
    <rect x="31" y="31" width="34" height="34" rx="6" fill="url(#purple)"/>
    <text x="48" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">A</text>

    <rect x="78" y="34" width="68" height="7" rx="3.5" fill="#E7E7F0"/>
    <rect x="78" y="48" width="86" height="7" rx="3.5" fill="#ECECF4"/>
    <rect x="78" y="62" width="53" height="7" rx="3.5" fill="#ECECF4"/>

    <rect x="152" y="29" width="27" height="27" rx="5" fill="#FBFBFF" stroke="#E8E8F4"/>
    <path d="M158 42h15M165.5 35v14" stroke="#C8C3E9" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- bottom card -->
  <g filter="url(#shadow)">
    <rect x="37" y="133" width="168" height="56" rx="11" fill="#FFFFFF"/>
    <rect x="49" y="145" width="34" height="34" rx="6" fill="#8C7BFF"/>
    <text x="66" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white">文</text>

    <rect x="95" y="148" width="77" height="7" rx="3.5" fill="#E7E7F0"/>
    <rect x="95" y="162" width="94" height="7" rx="3.5" fill="#ECECF4"/>
    <rect x="95" y="176" width="54" height="7" rx="3.5" fill="#ECECF4"/>
  </g>

  <!-- dotted flow -->
  <path d="M55 82 C55 102, 55 111, 60 132" stroke="#B9AFFF" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M171 84 C188 95, 193 111, 190 129" stroke="#A69BFF" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M186 125l4 7 5-6" stroke="#7B68F3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- refresh circle -->
  <circle cx="125" cy="106" r="28" fill="url(#purple)" filter="url(#shadow)"/>
  <path d="M113 103a13 13 0 0 1 21-8" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M133 90v8h-8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M137 109a13 13 0 0 1-21 8" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M117 122v-8h8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>